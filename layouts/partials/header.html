{{- $p := site.Data.profile -}}
<header class="site-header">
  <div class="wrap nav-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ $p.full_name }} 首页">
      <img class="brand-mark" src="{{ "images/monogram.svg" | relURL }}" alt="" width="28" height="28">
      <span>
        {{ $p.full_name }}
        <span class="brand-sub">Academic</span>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-label="切换导航菜单" aria-controls="nav-list" aria-expanded="false">菜单</button>
    <ul class="nav-list" id="nav-list">
      {{- range .Site.Menus.main -}}
      <li><a href="{{ .URL | relURL }}" {{ if eq $.RelPermalink (.URL | relURL) }}class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end -}}
    </ul>
  </div>
</header>
