# 部署到 GitHub Pages（Hugo 静态站点）
#
# 首次启用前必须做一次（只需一次）：
#   仓库 Settings → Pages → Build and deployment → Source → 选择 "GitHub Actions"
#
# 可选：仓库 Settings → Secrets and variables → Actions → Variables → New repository variable
#   CUSTOM_DOMAIN = chunguang-hu.com   （绑定自定义域名时填写，网址即可含姓名）
#
# 工作流会用 Pages 实际地址覆盖 baseURL，因此「用户站点」与「项目站点（带 /仓库名/ 子路径）」
# 都能正确生成 canonical、sitemap、OG 与站内链接，无需手工改 hugo.yaml。
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "data/**"
      - "layouts/**"
      - "static/**"
      - "hugo.yaml"
      - ".github/workflows/deploy-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: "0.170.0"
    steps:
      - name: 安装 Hugo Extended
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建站点
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          BASE_URL="${{ steps.pages.outputs.base_url }}/"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            BASE_URL="https://${CUSTOM_DOMAIN}/"
          fi
          hugo --gc --minify --baseURL "$BASE_URL"
          touch public/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then
            printf '%s\n' "$CUSTOM_DOMAIN" > public/CNAME
          fi
          echo "构建完成，baseURL = $BASE_URL"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
