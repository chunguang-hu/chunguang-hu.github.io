# 【备用方案】不经 Git 集成，直接用 wrangler 上传构建产物到 Cloudflare Pages
#
# 本仓库已切换为 GitHub Pages 自动部署，因此此工作流改为「仅手动触发」，
# 避免每次 push 都因缺少 CLOUDFLARE_* secrets 而报错。
# 需要时：GitHub → Actions → 「部署到 Cloudflare Pages」→ Run workflow。
#
# 前提：在仓库 Settings → Secrets and variables → Actions 中添加
#   CLOUDFLARE_API_TOKEN   具有「Cloudflare Pages: Edit」权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
name: 部署到 Cloudflare Pages（备用）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUGO_VERSION: "0.170.0"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Hugo Extended
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          tar -xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: 构建静态站点
        run: hugo --gc --minify

      - name: 上传到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=chunguang-hu-academic
